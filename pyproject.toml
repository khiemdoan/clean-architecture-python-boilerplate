[project]
name = "clean-architecture-boilerplate"
version = "0.1.0"
description = "Just a simple boilerplate to create a new project"
authors = [
    {name = "Khiem Doan", email = "doankhiem.crazy@gmail.com"},
]

readme = "README.md"
license = {text = "GPL-3"}

requires-python = "==3.14.*"

dependencies = [
    "tzdata==2026.2",
    "loguru==0.7.3",
    "fast-depends==3.0.8",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "psycopg[binary,pool]==3.3.4",
    "SQLAlchemy[asyncio]==2.0.51",
    "alembic==1.18.4",
    "advanced-alchemy==1.11.0",
    "Jinja2==3.1.6",
    "valkey-glide==2.4.1",
    "aio-pika==9.6.2",
    "celery==5.6.3",
    "httpx2[http2]==2.4.0",
    "tenacity==9.1.4",
    "APScheduler==4.0.0a6",
]

[dependency-groups]
tools = [
]
testing = [
    "pytest",
    "pytest-asyncio",
]
linting = [
    "isort",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.isort]
line_length = 120

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
